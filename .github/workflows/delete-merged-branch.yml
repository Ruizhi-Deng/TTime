name: Delete merged development branch

on:
  push:
    branches: [main]
    paths: [.github/workflows/delete-merged-branch.yml]

jobs:
  delete-merged-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete reverse-0915 after verifying its commits are in main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/reverse-0915" --jq .object.sha)
          git merge-base --is-ancestor "$branch_sha" HEAD
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/reverse-0915"
