name: Windows build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this version as a GitHub Release after verification
        type: boolean
        default: false
  push:
    branches:
      - reverse-0915
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply patched node modules
        run: npm run modules-update

      - name: Verify local history
        run: npm run test:local

      - name: Verify AI requests and streams
        run: npm run test:ai

      - name: Prepare pinned OCR models
        run: npm run prepare:ocr

      - name: Verify local OCR
        run: npm run test:ocr

      - name: Build Electron app
        run: npm run build

      - name: Package NSIS installer
        run: npx electron-builder --win nsis --config --publish never

      - name: Package portable build
        run: npx electron-builder --win portable --config --publish never

      - name: Verify packaged OCR resources
        run: node scripts/check-packaged-ocr.cjs

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TTime-windows-community
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error

  publish-release:
    needs: build-windows
    if: inputs.publish_release == true || startsWith(github.event.head_commit.message, 'Release TTime Community ')
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download verified Windows packages
        uses: actions/download-artifact@v4
        with:
          name: TTime-windows-community
          path: dist

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $packages = @(Get-ChildItem dist/*.exe)
          $packages | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          $assets = @($packages.FullName) + @("dist/SHA256SUMS.txt")
          gh release create "v$version" @assets --target "$env:GITHUB_SHA" --title "TTime Community $version" --notes-file "docs/releases/v$version.md" --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
