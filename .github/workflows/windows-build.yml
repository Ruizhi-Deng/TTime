name: Windows build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this version as a GitHub Release after verification
        type: boolean
        default: false

concurrency:
  group: windows-${{ github.ref }}-${{ inputs.publish_release == true }}
  cancel-in-progress: ${{ inputs.publish_release != true }}

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Require main for releases
        if: inputs.publish_release == true
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Releases must be built and published from main.'
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore installed dependencies
        id: dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: windows-2022-node16-dependencies-v1-${{ hashFiles('package-lock.json', 'node_modules_update/**', 'modules-update.ts') }}

      - name: Restore Electron, packaging tools and OCR models
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
            ocr/models
          key: windows-build-assets-v1-${{ hashFiles('src/common/ocr/models.json') }}

      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Apply patched node modules
        run: npm run modules-update

      - name: Build Electron app and prepare OCR models
        run: npm run build

      - name: Verify history, AI and local OCR
        run: npm run verify

      - name: Package installer and portable build together
        run: npx electron-builder --win nsis portable --config --publish never

      - name: Verify packaged OCR resources
        run: node scripts/check-packaged-ocr.cjs

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TTime-windows-community
          path: |
            dist/*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publish release
        if: github.ref == 'refs/heads/main' && inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          Get-ChildItem dist/*.exe | ForEach-Object {
            $name = $_.Name.Replace(' ', '.')
            if ($name -ne $_.Name) { Rename-Item $_.FullName $name }
          }
          $packages = @(Get-ChildItem dist/*.exe)
          $packages | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
          $assets = @($packages.FullName) + @("dist/SHA256SUMS.txt")
          $releases = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $existing = $releases | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if ($existing) {
            gh release upload "$tag" @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            @{ sha = $env:GITHUB_SHA; force = $true } | ConvertTo-Json | gh api --method PATCH "repos/$repo/git/refs/tags/$tag" --input -
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit "$tag" --target main --title "TTime Community $version" --notes-file "docs/releases/$tag.md" --latest
          } else {
            gh release create "$tag" @assets --target "$env:GITHUB_SHA" --title "TTime Community $version" --notes-file "docs/releases/$tag.md" --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
